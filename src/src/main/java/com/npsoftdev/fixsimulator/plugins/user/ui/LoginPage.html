<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>FIX Simulator — Sign In</title>
</head>
<body>

<div class="login-wrapper">

    <!-- Brand -->
    <div class="login-brand-bar">
        <i class="bi bi-activity brand-icon"></i>
        <span class="brand-name">FIX Simulator</span>
    </div>

    <!-- Card -->
    <div class="login-card">
        <div class="login-card-title">Sign in</div>
        <div class="login-card-subtitle">Enter your credentials to continue</div>

        <!-- Error messages -->
        <div class="feedback-panel">
            <ul wicket:id="feedback" class="feedbackPanelERROR" style="list-style:none;padding:0;margin:0;"></ul>
        </div>

        <form wicket:id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input wicket:id="username" type="text" id="username"
                       class="form-control" placeholder="Enter username"
                       autocomplete="username"/>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input wicket:id="password" type="password" id="password"
                       class="form-control" placeholder="Enter password"
                       autocomplete="current-password"/>
            </div>
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i>Sign In
            </button>
        </form>
    </div>

    <div class="login-footer">FIX Simulator &mdash; Internal Use Only</div>

</div>

</body>
</html>
