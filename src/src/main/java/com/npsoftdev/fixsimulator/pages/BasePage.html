<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>FIX Simulator</title>
</head>
<body>

<!-- ════════════════════════════════════════════════════
     TOP NAVBAR
     ════════════════════════════════════════════════════ -->
<nav class="navbar-top">

    <!-- Brand -->
    <a class="navbar-brand-text" href="/">
        <i class="bi bi-activity text-primary me-1"></i>FIX Simulator
    </a>

    <!-- Connection Info Box -->
    <div class="conn-info-box">
        <i class="bi bi-hdd-network text-secondary"></i>
        <span class="conn-name" wicket:id="connName">OrderRouter-01</span>
        <span class="sep">|</span>
        <span wicket:id="connStatus" class="badge bg-success">CONNECTED</span>
        <span class="sep">|</span>
        <span class="text-secondary" style="font-size:0.78rem;">TX Seq:</span>
        <span class="conn-seq" wicket:id="txSeq">42</span>
        <span class="text-secondary" style="font-size:0.78rem;">RX Seq:</span>
        <span class="conn-seq" wicket:id="rxSeq">38</span>
        <span class="sep">|</span>
        <a wicket:id="connectBtn" class="btn btn-sm btn-danger py-0 px-2" style="font-size:0.8rem;">
            <i class="bi bi-x-circle me-1"></i>Disconnect
        </a>
        <a wicket:id="manageSeqBtn" class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size:0.8rem;">
            <i class="bi bi-sliders me-1"></i>Seq Mgmt
        </a>
    </div>

    <!-- Switch Connection -->
    <div class="dropdown">
        <button class="btn btn-sm btn-outline-secondary text-white dropdown-toggle" type="button"
                data-bs-toggle="dropdown" style="font-size:0.8rem;">
            <i class="bi bi-shuffle me-1"></i>Switch Connection
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><h6 class="dropdown-header">Available Sessions</h6></li>
            <li><a class="dropdown-item active" href="#">
                <i class="bi bi-circle-fill text-success me-2" style="font-size:0.5rem;"></i>OrderRouter-01
            </a></li>
            <li><a class="dropdown-item" href="#">
                <i class="bi bi-circle-fill text-danger me-2" style="font-size:0.5rem;"></i>MarketData-Feed
            </a></li>
            <li><a class="dropdown-item" href="#">
                <i class="bi bi-circle-fill text-warning me-2" style="font-size:0.5rem;"></i>DropCopy-01
            </a></li>
            <li><hr class="dropdown-divider"/></li>
            <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Manage Connections</a></li>
        </ul>
    </div>

    <!-- User Menu -->
    <div class="dropdown">
        <button class="btn btn-sm btn-outline-secondary text-white dropdown-toggle" type="button"
                data-bs-toggle="dropdown" style="font-size:0.8rem;">
            <i class="bi bi-person-circle me-1"></i>admin
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
            <li><hr class="dropdown-divider"/></li>
            <li><a class="dropdown-item text-danger" href="#">
                <i class="bi bi-box-arrow-right me-2"></i>Sign Out
            </a></li>
        </ul>
    </div>
</nav>

<!-- ════════════════════════════════════════════════════
     MAIN WRAPPER  (sidebar + content)
     ════════════════════════════════════════════════════ -->
<div class="d-flex flex-grow-1">

    <!-- ── Sidebar ─────────────────────────────────────── -->
    <nav class="sidebar">
        <ul class="nav flex-column pt-2 flex-grow-1">

            <!-- Overview items (e.g. Dashboard) — no section heading -->
            <li class="nav-item" wicket:id="overviewNav">
                <a wicket:id="navLink" href="#">
                    <i wicket:id="navIcon" class="bi"></i>
                    <span wicket:id="navLabel">Label</span>
                </a>
            </li>

            <!-- FIX Testing section -->
            <li><div class="section-label">FIX Testing</div></li>
            <li class="nav-item" wicket:id="monitoringNav">
                <a wicket:id="navLink" href="#">
                    <i wicket:id="navIcon" class="bi"></i>
                    <span wicket:id="navLabel">Label</span>
                </a>
            </li>

            <!-- Administration section -->
            <li><div class="section-label">Administration</div></li>
            <li class="nav-item" wicket:id="adminNav">
                <a wicket:id="navLink" href="#">
                    <i wicket:id="navIcon" class="bi"></i>
                    <span wicket:id="navLabel">Label</span>
                </a>
            </li>

        </ul>
        <div class="sidebar-footer">v1.0-SNAPSHOT</div>
    </nav>

    <!-- ── Content Area ────────────────────────────────── -->
    <main class="content-area">
        <wicket:child/>
    </main>

</div>

</body>
</html>
