<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>

<!-- Page Header -->
<div class="page-header">
    <h4><i class="bi bi-layout-text-window-reverse me-2 text-primary"></i>FIX Message Templates</h4>
    <a wicket:id="createBtn" class="btn btn-sm btn-success">
        <i class="bi bi-plus-circle me-1"></i>New Template
    </a>
</div>

<!-- Templates Table -->
<div class="table-card">
    <div class="table-responsive">
        <table class="table table-sm table-hover mb-0">
            <thead>
                <tr class="table-dark">
                    <th>Name</th>
                    <th>MsgType</th>
                    <th>Scope</th>
                    <th class="text-center" title="Lower number = selected first when multiple templates share the same MsgType">Priority</th>
                    <th class="text-center">Fields</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody wicket:id="tableBody">

                <tr wicket:id="emptyRow">
                    <td colspan="7" class="text-center text-muted py-4">
                        <i class="bi bi-inbox me-1"></i>
                        No templates yet — click <strong>New Template</strong> to create one.
                    </td>
                </tr>

                <tr wicket:id="templateRows">
                    <td class="fw-semibold">
                        <span wicket:id="tName"></span>
                        <span wicket:id="protectedBadge"
                              class="badge bg-warning text-dark ms-1"
                              title="Built-in template — cannot be deleted">
                            <i class="bi bi-lock-fill me-1"></i>Built-in
                        </span>
                    </td>
                    <td><span class="badge bg-secondary font-monospace" wicket:id="tMsgType"></span></td>
                    <td><span wicket:id="tScope" class="badge"></span></td>
                    <td class="text-center">
                        <span class="badge bg-light text-dark border font-monospace"
                              wicket:id="tPriority"></span>
                    </td>
                    <td class="text-center">
                        <span class="badge bg-light text-dark border" wicket:id="tFieldCount"></span>
                    </td>
                    <td class="text-muted" style="font-size:0.82rem;" wicket:id="tDescription"></td>
                    <td class="text-nowrap">
                        <a wicket:id="editBtn"
                           class="btn btn-sm btn-outline-primary py-0 px-2 me-1"
                           title="Edit Template">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a wicket:id="deleteBtn"
                           class="btn btn-sm btn-outline-danger py-0 px-2"
                           title="Delete Template">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>

            </tbody>
        </table>
    </div>
</div>

</wicket:extend>
</body>
</html>
