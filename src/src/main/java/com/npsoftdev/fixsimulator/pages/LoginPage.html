<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>FIX Simulator — Sign In</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1d23;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #22262e;
            border: 1px solid #2e3340;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .login-brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.25rem;
        }
        .login-subtitle {
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }
        .form-control {
            background: #161b22;
            border: 1px solid #30363d;
            color: #e6edf3;
        }
        .form-control:focus {
            background: #161b22;
            border-color: #388bfd;
            color: #e6edf3;
            box-shadow: 0 0 0 3px rgba(56,139,253,0.2);
        }
        .form-label {
            color: #8b949e;
            font-size: 0.85rem;
        }
        .btn-login {
            background: #238636;
            border: 1px solid #2ea043;
            color: #fff;
            width: 100%;
            padding: 0.55rem;
            font-weight: 600;
        }
        .btn-login:hover {
            background: #2ea043;
            color: #fff;
        }
        .feedback-container .feedbackPanelERROR {
            background: rgba(248,81,73,0.12);
            border: 1px solid rgba(248,81,73,0.4);
            color: #f85149;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            list-style: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-brand">
        <i class="bi bi-activity text-primary me-2"></i>FIX Simulator
    </div>
    <div class="login-subtitle">Sign in to your account</div>

    <!-- Feedback (errors) -->
    <div class="feedback-container">
        <ul wicket:id="feedback" class="feedbackPanel"></ul>
    </div>

    <form wicket:id="loginForm">
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input wicket:id="username" type="text" id="username"
                   class="form-control" placeholder="Enter username" autocomplete="username"/>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input wicket:id="password" type="password" id="password"
                   class="form-control" placeholder="Enter password" autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
    </form>
</div>

</body>
</html>
