<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>

<!-- Inline script for value-type show/hide within field rows -->
<script>
function updateFieldInputs(selectEl) {
    var row = selectEl.closest('tr');
    if (!row) return;
    row.querySelectorAll('[data-for-type]').forEach(function(d) { d.style.display = 'none'; });
    var target = row.querySelector('[data-for-type="' + selectEl.value + '"]');
    if (target) target.style.display = '';
}
function initFieldInputs() {
    document.querySelectorAll('.field-type-select').forEach(function(sel) {
        updateFieldInputs(sel);
    });
}
document.addEventListener('DOMContentLoaded', initFieldInputs);
</script>

<!-- Page Header -->
<div class="page-header">
    <h4><i class="bi bi-layout-text-window-reverse me-2 text-primary"></i>Order Templates</h4>
    <a wicket:id="createBtn" class="btn btn-sm btn-success">
        <i class="bi bi-plus-circle me-1"></i>New Template
    </a>
</div>

<!-- Templates Table -->
<div class="table-card">
    <div class="table-responsive">
        <table class="table table-sm table-hover mb-0">
            <thead>
                <tr class="table-dark">
                    <th>Name</th>
                    <th>MsgType</th>
                    <th>Scope</th>
                    <th class="text-center">Fields</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody wicket:id="tableBody">

                <!-- Empty state -->
                <tr wicket:id="emptyRow">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-inbox me-1"></i>
                        No templates yet — click <strong>New Template</strong> to create one.
                    </td>
                </tr>

                <!-- Template rows -->
                <tr wicket:id="templateRows">
                    <td class="fw-semibold" wicket:id="tName"></td>
                    <td><span class="badge bg-secondary font-monospace" wicket:id="tMsgType"></span></td>
                    <td><span wicket:id="tScope" class="badge"></span></td>
                    <td class="text-center">
                        <span class="badge bg-light text-dark border" wicket:id="tFieldCount"></span>
                    </td>
                    <td class="text-muted" style="font-size:0.82rem;" wicket:id="tDescription"></td>
                    <td class="text-nowrap">
                        <a wicket:id="editBtn"
                           class="btn btn-sm btn-outline-primary py-0 px-2 me-1"
                           title="Edit Template">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a wicket:id="deleteBtn"
                           class="btn btn-sm btn-outline-danger py-0 px-2"
                           title="Delete Template">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>

            </tbody>
        </table>
    </div>
</div>

<!-- ════════════════════════════════════════════════════════
     CREATE / EDIT TEMPLATE MODAL
     ════════════════════════════════════════════════════ -->
<div class="modal fade" id="templateModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-layout-text-window-reverse me-2 text-primary"></i>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form wicket:id="modalForm">
                <div class="modal-header border-0 pt-0">
                    <span class="fw-semibold" wicket:id="modalTitle">Template</span>
                </div>
                <div class="modal-body pt-0">

                    <div wicket:id="modalFeedback" class="mb-2"></div>

                    <!-- ── Metadata ──────────────────────────────────────── -->
                    <h6 class="fw-semibold text-secondary mb-3">
                        <i class="bi bi-info-circle me-1"></i>Template Metadata
                    </h6>
                    <div class="row g-3 mb-4">

                        <div class="col-12">
                            <label class="form-label fw-semibold" style="font-size:0.82rem;">
                                Template ID <span class="text-muted">(auto-generated)</span>
                            </label>
                            <div class="font-monospace text-muted"
                                 style="font-size:0.75rem; word-break:break-all;"
                                 wicket:id="idDisplay"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Name <span class="text-danger">*</span>
                            </label>
                            <input type="text" wicket:id="name"
                                   class="form-control form-control-sm"
                                   placeholder="e.g. New Order Single — AAPL"/>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                MsgType <span class="text-danger">*</span>
                            </label>
                            <input type="text" wicket:id="msgType"
                                   class="form-control form-control-sm font-monospace"
                                   placeholder="e.g. D, G, F"/>
                            <div class="form-text">FIX MsgType field value (tag 35).</div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                BeginString <span class="text-danger">*</span>
                            </label>
                            <input type="text" wicket:id="beginString"
                                   class="form-control form-control-sm font-monospace"
                                   placeholder="FIX.4.4"/>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Description</label>
                            <input type="text" wicket:id="description"
                                   class="form-control form-control-sm"
                                   placeholder="Optional description"/>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Scope</label>
                            <select wicket:id="scopeType"
                                    class="form-select form-select-sm"></select>
                        </div>

                        <div class="col-md-8">
                            <label class="form-label fw-semibold">
                                Session ID
                                <span class="text-muted" style="font-weight:400;font-size:0.8rem;">
                                    (required when Scope = Session)
                                </span>
                            </label>
                            <input type="text" wicket:id="scopeSessionId"
                                   class="form-control form-control-sm font-monospace"
                                   placeholder="e.g. FIX.4.4:SIMULATOR->EXCHANGE"/>
                        </div>
                    </div>

                    <!-- ── Field Specs ───────────────────────────────────── -->
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-semibold text-secondary mb-0">
                            <i class="bi bi-list-ul me-1"></i>Field Specs
                        </h6>
                        <button wicket:id="addFieldBtn" type="button"
                                class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-plus me-1"></i>Add Field
                        </button>
                    </div>

                    <div wicket:id="fieldsContainer">
                        <div class="table-responsive">
                            <table class="table table-sm table-bordered mb-2"
                                   style="font-size:0.82rem;">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width:70px;">Tag</th>
                                        <th style="width:110px;">Type</th>
                                        <th>Value / Config</th>
                                        <th style="width:40px;"></th>
                                    </tr>
                                </thead>
                                <tbody>

                                    <!-- Empty state row -->
                                    <tr wicket:id="emptyFieldsRow">
                                        <td colspan="4" class="text-center text-muted py-3">
                                            <i class="bi bi-plus-circle me-1"></i>
                                            No fields yet — click <strong>Add Field</strong> above.
                                        </td>
                                    </tr>

                                    <!-- Field rows (repeated by ListView) -->
                                    <tr wicket:id="fieldRows" class="align-middle">

                                        <!-- Tag -->
                                        <td>
                                            <input type="number" wicket:id="tag"
                                                   class="form-control form-control-sm font-monospace"
                                                   min="1" placeholder="tag"/>
                                        </td>

                                        <!-- Value type selector -->
                                        <td>
                                            <select wicket:id="valueType"
                                                    class="form-select form-select-sm field-type-select"
                                                    onchange="updateFieldInputs(this)"></select>
                                        </td>

                                        <!-- Type-specific value inputs -->
                                        <td>

                                            <!-- Literal -->
                                            <div data-for-type="Literal">
                                                <input type="text" wicket:id="literalValue"
                                                       class="form-control form-control-sm font-monospace"
                                                       placeholder="literal value"/>
                                            </div>

                                            <!-- UserInput -->
                                            <div data-for-type="UserInput" style="display:none;">
                                                <div class="row g-1">
                                                    <div class="col-6">
                                                        <input type="text" wicket:id="uiName"
                                                               class="form-control form-control-sm"
                                                               placeholder="input name (e.g. symbol)"/>
                                                    </div>
                                                    <div class="col-6">
                                                        <input type="text" wicket:id="uiDefault"
                                                               class="form-control form-control-sm"
                                                               placeholder="default value (optional)"/>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Placeholder -->
                                            <div data-for-type="Placeholder" style="display:none;">
                                                <select wicket:id="placeholderType"
                                                        class="form-select form-select-sm font-monospace"></select>
                                            </div>

                                            <!-- Derived -->
                                            <div data-for-type="Derived" style="display:none;">
                                                <div class="row g-1">
                                                    <div class="col-4">
                                                        <input type="number" wicket:id="derivedSourceTag"
                                                               class="form-control form-control-sm font-monospace"
                                                               placeholder="source tag"/>
                                                    </div>
                                                    <div class="col-8">
                                                        <input type="text" wicket:id="derivedMappingName"
                                                               class="form-control form-control-sm"
                                                               placeholder="mapping name (e.g. symbol-to-isin)"/>
                                                    </div>
                                                </div>
                                            </div>

                                        </td>

                                        <!-- Remove -->
                                        <td class="text-center">
                                            <button wicket:id="removeFieldBtn" type="button"
                                                    class="btn btn-sm btn-outline-danger py-0 px-1">
                                                <i class="bi bi-x"></i>
                                            </button>
                                        </td>

                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <!-- /fieldsContainer -->

                </div><!-- /modal-body -->

                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-secondary"
                            data-bs-dismiss="modal">Cancel</button>
                    <button wicket:id="saveBtn" class="btn btn-sm btn-primary">
                        <i class="bi bi-check-circle me-1"></i>Save Template
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
<!-- /templateModal -->

</wicket:extend>
</body>
</html>
