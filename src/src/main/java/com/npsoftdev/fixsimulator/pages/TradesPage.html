<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>

    <!-- Page Header -->
    <div class="page-header">
        <h4><i class="bi bi-arrow-left-right me-2 text-primary"></i>Trades (Execution Reports)</h4>
    </div>

    <!-- Trades Table -->
    <div class="table-card">
        <div class="table-responsive">
            <form wicket:id="filterForm" onsubmit="return false;">
                <table class="table table-sm table-hover mb-0">

                    <thead>
                        <tr class="table-dark">
                            <th class="font-monospace">Exec ID</th>
                            <th class="font-monospace">Cl.Ord ID</th>
                            <th>Exec Type</th>
                            <th>Symbol</th>
                            <th>Side</th>
                            <th>Last Qty</th>
                            <th>Last Px</th>
                            <th>Cum Qty</th>
                            <th>Avg Px</th>
                            <th>Ord Status</th>
                            <th>Time</th>
                        </tr>

                        <tr class="table-secondary align-middle">
                            <th style="padding:4px 6px;">
                                <input type="text" wicket:id="filterExecId"
                                       class="form-control form-control-sm font-monospace"
                                       placeholder="Filter ID…" style="min-width:100px;"/>
                            </th>
                            <th style="padding:4px 6px;">
                                <input type="text" wicket:id="filterClOrdId"
                                       class="form-control form-control-sm font-monospace"
                                       placeholder="Filter ID…" style="min-width:100px;"/>
                            </th>
                            <th style="padding:4px 6px;">
                                <select wicket:id="filterExecType"
                                        class="form-select form-select-sm"
                                        style="min-width:90px;"></select>
                            </th>
                            <th style="padding:4px 6px;">
                                <input type="text" wicket:id="filterSymbol"
                                       class="form-control form-control-sm"
                                       placeholder="Symbol…" style="min-width:80px;"/>
                            </th>
                            <th style="padding:4px 6px;">
                                <select wicket:id="filterSide"
                                        class="form-select form-select-sm"
                                        style="min-width:80px;"></select>
                            </th>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody wicket:id="tableBody">

                        <tr wicket:id="emptyRow">
                            <td colspan="11" class="text-center text-muted py-4">
                                <i class="bi bi-inbox me-1"></i>
                                No trades yet — waiting for Partially Filled or Filled execution reports.
                            </td>
                        </tr>

                        <tr wicket:id="tradeRows">
                            <td class="font-monospace" style="font-size:0.8rem;">
                                <span wicket:id="execId"></span>
                            </td>
                            <td class="font-monospace" style="font-size:0.8rem;">
                                <span wicket:id="clOrdId"></span>
                            </td>
                            <td><span wicket:id="execType" class="badge">—</span></td>
                            <td class="fw-semibold" wicket:id="symbol"></td>
                            <td><span wicket:id="side" class="badge">—</span></td>
                            <td wicket:id="lastQty"></td>
                            <td wicket:id="lastPx"></td>
                            <td wicket:id="cumQty"></td>
                            <td wicket:id="avgPx"></td>
                            <td><span wicket:id="ordStatus" class="badge">—</span></td>
                            <td class="text-muted" style="font-size:0.8rem;" wicket:id="transactTime"></td>
                        </tr>

                    </tbody>
                </table>
            </form>
        </div>

        <!-- Pagination footer — separate Wicket container so the timer can refresh
             it independently without disturbing the filter input fields above. -->
        <div wicket:id="pagingFooter"
             class="d-flex justify-content-between align-items-center px-3 py-2 border-top"
             style="font-size:0.8rem; color:#6b7280;">

            <span wicket:id="summary">Showing execution reports</span>

            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li wicket:id="prevItem" class="page-item">
                        <a wicket:id="prevPage" class="page-link" href="#">&#8592;</a>
                    </li>
                    <li class="page-item disabled">
                        <span wicket:id="pageInfo" class="page-link"
                              style="min-width:70px; text-align:center;">1 / 1</span>
                    </li>
                    <li wicket:id="nextItem" class="page-item">
                        <a wicket:id="nextPage" class="page-link" href="#">&#8594;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</wicket:extend>
</body>
</html>
