<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>

    <!-- Page Header -->
    <div class="page-header">
        <h4><i class="bi bi-send me-2 text-primary"></i>Dynamic Orders</h4>
    </div>

    <form wicket:id="sendForm">
        <div wicket:id="feedback" class="mb-3"></div>

        <!-- ── Template Selection ───────────────────────────────────────── -->
        <div class="table-card mb-3 p-3">
            <h6 class="fw-semibold mb-3">
                <i class="bi bi-layout-text-window-reverse me-2 text-secondary"></i>Select Template
            </h6>
            <div class="row g-3 align-items-end">
                <div class="col-md-7">
                    <label class="form-label fw-semibold">
                        FIX Message Template <span class="text-danger">*</span>
                    </label>
                    <select wicket:id="templateSelector" class="form-select form-select-sm"></select>
                    <div class="form-text">Templates visible to the active session are listed.</div>
                </div>
            </div>
        </div>

        <!-- ── Dialog Panel (AJAX-refreshed) ───────────────────────────── -->
        <div wicket:id="dialogPanel">

            <!-- No template selected -->
            <div wicket:id="noTemplateMsg" class="table-card p-4 text-center text-muted mb-3">
                <i class="bi bi-arrow-up-circle me-2"></i>
                Select a template above to see its input fields.
            </div>

            <!-- Template selected — dialog body -->
            <div wicket:id="dialogBody" class="table-card mb-3 p-3">

                <!-- Dialog header -->
                <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
                    <h5 class="fw-semibold mb-0" wicket:id="dialogTitle">New Order</h5>
                    <span class="badge bg-secondary font-monospace"
                          title="MsgType" wicket:id="tmplMsgType"></span>
                    <span class="text-muted" style="font-size:0.85rem;"
                          wicket:id="tmplDescription"></span>
                    <span class="badge bg-light text-secondary border ms-auto"
                          wicket:id="tmplScope"></span>
                </div>
                <hr class="mt-0 mb-3"/>

                <!-- Standard order instruction fields (Symbol, Side, Price, Qty) -->
                <div wicket:id="standardSection">
                    <h6 class="fw-semibold text-secondary mb-2" style="font-size:0.82rem;">
                        <i class="bi bi-grid-3x3 me-1"></i>Order Instruction
                    </h6>
                    <div class="row g-3 mb-3">
                        <div wicket:id="standardFieldRows" class="col-md-3">
                            <label class="form-label fw-semibold mb-1"
                                   style="font-size:0.82rem;"
                                   wicket:id="fieldLabel">Field</label>
                            <div class="form-text mt-0 mb-1" wicket:id="fieldHint"></div>
                            <!-- text input -->
                            <div wicket:id="textInputDiv">
                                <input type="text" wicket:id="fieldValue"
                                       class="form-control form-control-sm font-monospace"/>
                            </div>
                            <!-- dropdown -->
                            <div wicket:id="enumInputDiv">
                                <select wicket:id="fieldEnum"
                                        class="form-select form-select-sm font-monospace"></select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Additional fields (remaining UserInput / Enumeration) -->
                <div wicket:id="additionalSection">
                    <h6 class="fw-semibold text-secondary mb-2" style="font-size:0.82rem;">
                        <i class="bi bi-list-ul me-1"></i>Additional Fields
                    </h6>
                    <div wicket:id="additionalFieldRows" class="mb-2">
                        <div class="row g-2 align-items-start mb-2">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold text-nowrap mb-0"
                                       style="font-size:0.82rem;"
                                       wicket:id="fieldLabel">Field</label>
                                <div class="form-text mt-0" wicket:id="fieldHint"></div>
                            </div>
                            <div class="col-md-5">
                                <!-- text input -->
                                <div wicket:id="textInputDiv">
                                    <input type="text" wicket:id="fieldValue"
                                           class="form-control form-control-sm font-monospace"/>
                                </div>
                                <!-- dropdown -->
                                <div wicket:id="enumInputDiv">
                                    <select wicket:id="fieldEnum"
                                            class="form-select form-select-sm font-monospace"></select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- No inputs needed notice -->
                <div wicket:id="noInputsMsg" class="text-muted py-2" style="font-size:0.88rem;">
                    <i class="bi bi-check-circle me-1 text-success"></i>
                    No input required — all fields are pre-configured in the template.
                </div>

            </div>
        </div>
        <!-- /dialogPanel -->

        <!-- ── Send ─────────────────────────────────────────────────────── -->
        <div class="d-flex gap-2 mt-2">
            <button wicket:id="sendBtn" class="btn btn-success btn-sm">
                <i class="bi bi-send me-1"></i>Send Message
            </button>
        </div>

    </form>

</wicket:extend>
</body>
</html>
