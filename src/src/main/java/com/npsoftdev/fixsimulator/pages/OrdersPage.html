<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>

    <!-- Page Header -->
    <div class="page-header">
        <h4><i class="bi bi-card-list me-2 text-primary"></i>Orders</h4>
        <button class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
        </button>
    </div>

    <!-- Toolbar — New Order only; Amend/Cancel moved to each row -->
    <div class="toolbar mb-3">
        <button class="btn btn-sm btn-success"
                data-bs-toggle="modal" data-bs-target="#newOrderModal">
            <i class="bi bi-plus-circle me-1"></i>New Order
        </button>
    </div>

    <!-- Orders Table -->
    <div class="table-card">
        <div class="table-responsive">

            <!--
              filterForm wraps the entire table so filter inputs inside <thead>
              are proper Wicket form components that can fire AJAX updates.
              onsubmit="return false" prevents accidental full-page submit on Enter.
            -->
            <form wicket:id="filterForm" onsubmit="return false;">
                <table class="table table-sm table-hover mb-0">

                    <thead>
                        <!-- Column headers -->
                        <tr class="table-dark">
                            <th class="font-monospace">Cl.Ord ID</th>
                            <th>Symbol</th>
                            <th>Side</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Ord Type</th>
                            <th>TIF</th>
                            <th>Status</th>
                            <th>Cum Qty</th>
                            <th>Avg Px</th>
                            <th>Send Time</th>
                            <th>Actions</th>
                        </tr>

                        <!-- Per-column filter row -->
                        <tr class="table-secondary align-middle">
                            <th style="padding:4px 6px;">
                                <input type="text" wicket:id="filterClOrdId"
                                       class="form-control form-control-sm font-monospace"
                                       placeholder="Filter ID…" style="min-width:100px;"/>
                            </th>
                            <th style="padding:4px 6px;">
                                <input type="text" wicket:id="filterSymbol"
                                       class="form-control form-control-sm"
                                       placeholder="Symbol…" style="min-width:80px;"/>
                            </th>
                            <th style="padding:4px 6px;">
                                <select wicket:id="filterSide"
                                        class="form-select form-select-sm"
                                        style="min-width:80px;"></select>
                            </th>
                            <th></th><!-- Qty — no filter -->
                            <th></th><!-- Price — no filter -->
                            <th style="padding:4px 6px;">
                                <select wicket:id="filterOrdType"
                                        class="form-select form-select-sm"
                                        style="min-width:90px;"></select>
                            </th>
                            <th style="padding:4px 6px;">
                                <select wicket:id="filterTimeInForce"
                                        class="form-select form-select-sm"
                                        style="min-width:75px;"></select>
                            </th>
                            <th style="padding:4px 6px;">
                                <select wicket:id="filterStatus"
                                        class="form-select form-select-sm"
                                        style="min-width:100px;"></select>
                            </th>
                            <th></th><!-- CumQty — no filter -->
                            <th></th><!-- AvgPx — no filter -->
                            <th></th><!-- SendTime — no filter -->
                            <th></th><!-- Actions — no filter -->
                        </tr>
                    </thead>

                    <tbody wicket:id="tableBody">

                        <!-- Empty-state row -->
                        <tr wicket:id="emptyRow">
                            <td colspan="12" class="text-center text-muted py-4">
                                <i class="bi bi-inbox me-1"></i>
                                No orders yet — select a session and click <strong>New Order</strong>.
                            </td>
                        </tr>

                        <!-- Order rows (repeated by ListView) -->
                        <tr wicket:id="orderRows">
                            <td class="font-monospace" style="font-size:0.8rem;">
                                <span wicket:id="clOrdId"></span>
                            </td>
                            <td class="fw-semibold" wicket:id="symbol"></td>
                            <td><span wicket:id="side" class="badge">—</span></td>
                            <td wicket:id="quantity"></td>
                            <td wicket:id="price"></td>
                            <td wicket:id="ordType"></td>
                            <td wicket:id="timeInForce"></td>
                            <td><span wicket:id="status" class="badge">—</span></td>
                            <td wicket:id="cumQty"></td>
                            <td wicket:id="avgPx"></td>
                            <td class="text-muted" style="font-size:0.8rem;" wicket:id="sendTime"></td>
                            <td class="text-nowrap">
                                <a wicket:id="amendBtn"
                                   class="btn btn-sm btn-outline-warning py-0 px-1 me-1"
                                   title="Amend Order">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a wicket:id="cancelBtn"
                                   class="btn btn-sm btn-outline-danger py-0 px-1"
                                   title="Cancel Order">
                                    <i class="bi bi-x-circle"></i>
                                </a>
                            </td>
                        </tr>

                    </tbody>
                </table>
            </form>
        </div>

        <!-- Pagination (static placeholder) -->
        <div class="d-flex justify-content-between align-items-center px-3 py-2 border-top"
             style="font-size:0.8rem; color:#6b7280;">
            <span>Showing all matching orders</span>
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item disabled"><a class="page-link" href="#">&#8592;</a></li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item disabled"><a class="page-link" href="#">&#8594;</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- ── New Order Modal ──────────────────────────────────────────────────── -->
    <div class="modal fade" id="newOrderModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-plus-circle me-2"></i>New Order
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form wicket:id="newOrderForm">
                    <div class="modal-body">

                        <div wicket:id="feedback" class="mb-2"></div>

                        <div class="row g-3">

                            <div class="col-6">
                                <label class="form-label fw-semibold">
                                    Symbol <span class="text-danger">*</span>
                                </label>
                                <input type="text" wicket:id="symbol"
                                       class="form-control form-control-sm font-monospace"
                                       placeholder="e.g. AAPL"/>
                            </div>

                            <div class="col-6">
                                <label class="form-label fw-semibold">
                                    Side <span class="text-danger">*</span>
                                </label>
                                <select wicket:id="side" class="form-select form-select-sm"></select>
                            </div>

                            <div class="col-6">
                                <label class="form-label fw-semibold">
                                    Quantity <span class="text-danger">*</span>
                                </label>
                                <input type="number" wicket:id="quantity"
                                       class="form-control form-control-sm" min="1"/>
                            </div>

                            <div class="col-6">
                                <label class="form-label fw-semibold">Price</label>
                                <input type="number" step="0.0001" wicket:id="price"
                                       class="form-control form-control-sm" placeholder="0.0000"/>
                                <div class="form-text">Leave blank for Market orders.</div>
                            </div>

                            <div class="col-6">
                                <label class="form-label fw-semibold">
                                    Order Type <span class="text-danger">*</span>
                                </label>
                                <select wicket:id="ordType" class="form-select form-select-sm"></select>
                            </div>

                            <div class="col-6">
                                <label class="form-label fw-semibold">
                                    Time In Force <span class="text-danger">*</span>
                                </label>
                                <select wicket:id="timeInForce" class="form-select form-select-sm"></select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Cl.Ord ID</label>
                                <input type="text" class="form-control form-control-sm bg-light text-muted"
                                       value="(auto-generated)" readonly/>
                                <div class="form-text">Assigned automatically by the FIX engine.</div>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Text (tag 58)</label>
                                <textarea wicket:id="text" rows="2"
                                          class="form-control form-control-sm font-monospace"
                                          placeholder="Optional free-text comment sent in the FIX message"></textarea>
                            </div>

                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm"
                                data-bs-dismiss="modal">Cancel</button>
                        <button wicket:id="sendBtn" class="btn btn-success btn-sm">
                            <i class="bi bi-send me-1"></i>Send NewOrderSingle
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</wicket:extend>
</body>
</html>
