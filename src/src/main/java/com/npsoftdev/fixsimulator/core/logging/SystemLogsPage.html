<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>

<div class="page-header">
    <h4><i class="bi bi-file-earmark-text me-2 text-primary"></i>System Logs</h4>
    <a wicket:id="downloadLink" href="#" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-download me-1"></i>Download Log
    </a>
</div>

<!-- Toolbar -->
<div class="log-toolbar mb-3">

    <!-- Left: toggles -->
    <div class="d-flex align-items-center gap-3">
        <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="wrapToggle"/>
            <label class="form-check-label small" for="wrapToggle">Wrap lines</label>
        </div>
        <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="tailToggle" checked/>
            <label class="form-check-label small" for="tailToggle">
                <span id="tailLabel">Tailing</span>
            </label>
        </div>
    </div>

    <!-- Right: search -->
    <div class="d-flex align-items-center gap-2">
        <div class="form-check mb-0 d-flex align-items-center gap-1">
            <input class="form-check-input" type="checkbox" id="regexToggle"/>
            <label class="form-check-label small" for="regexToggle">Regex</label>
        </div>
        <div class="input-group input-group-sm log-search-group">
            <span class="input-group-text log-search-icon">
                <i class="bi bi-search"></i>
            </span>
            <input type="text" class="form-control log-search-input" id="searchInput"
                   placeholder="Search logs (string or regex)..."/>
            <button class="btn log-search-clear" id="searchClear" title="Clear search">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>

</div>

<!-- Log viewer -->
<div class="log-viewer-card">
    <div id="logContent" class="log-content">
        <div id="logLines"></div>
    </div>
    <div class="log-status-bar">
        <span class="bi bi-circle-fill log-tail-dot" id="tailDot"></span>
        <span id="logStatus">Loading...</span>
        <span id="searchStatus" class="log-search-status"></span>
    </div>
</div>

</wicket:extend>
</body>
</html>
