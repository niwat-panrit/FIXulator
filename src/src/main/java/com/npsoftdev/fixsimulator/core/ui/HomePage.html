<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>

<div wicket:id="dashboard">

    <!-- Page header -->
    <div class="page-header">
        <h4><i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard</h4>
        <span class="text-muted" style="font-size:0.8rem;">
            <i class="bi bi-arrow-clockwise me-1"></i>Updated: <span wicket:id="lastUpdated"></span>
        </span>
    </div>

    <!-- ── Stat Cards ────────────────────────────────────────────────────────── -->
    <div class="row g-3 mb-4">

        <div class="col-sm-6 col-xl-3">
            <div class="stat-card d-flex justify-content-between align-items-start">
                <div>
                    <div class="stat-value text-success" wicket:id="activeConnections">0</div>
                    <div class="stat-label">Active Connections</div>
                </div>
                <i class="bi bi-hdd-network text-success" style="font-size:2.2rem;opacity:0.15;"></i>
            </div>
        </div>

        <div class="col-sm-6 col-xl-3">
            <div class="stat-card d-flex justify-content-between align-items-start">
                <div>
                    <div class="stat-value text-primary" wicket:id="ordersTotal">0</div>
                    <div class="stat-label">Total Orders</div>
                </div>
                <i class="bi bi-card-list text-primary" style="font-size:2.2rem;opacity:0.15;"></i>
            </div>
        </div>

        <div class="col-sm-6 col-xl-3">
            <div class="stat-card d-flex justify-content-between align-items-start">
                <div>
                    <div class="stat-value text-info" wicket:id="tradesFilled">0</div>
                    <div class="stat-label">Trades Filled</div>
                </div>
                <i class="bi bi-arrow-left-right text-info" style="font-size:2.2rem;opacity:0.15;"></i>
            </div>
        </div>

        <div class="col-sm-6 col-xl-3">
            <div class="stat-card d-flex justify-content-between align-items-start">
                <div>
                    <div class="stat-value text-warning" wicket:id="messagesLastHour">0</div>
                    <div class="stat-label">Messages (last hour)</div>
                </div>
                <i class="bi bi-envelope text-warning" style="font-size:2.2rem;opacity:0.15;"></i>
            </div>
        </div>

    </div>

    <!-- ── Connection Status + Recent Messages ───────────────────────────────── -->
    <div class="row g-3">

        <!-- Session Status -->
        <div class="col-lg-5">
            <div class="table-card">
                <div class="table-card-header">
                    <span><i class="bi bi-hdd-network me-2 text-secondary"></i>Session Status</span>
                </div>
                <table class="table table-sm mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Connection</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>TX&nbsp;/&nbsp;RX</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr wicket:id="noSessions">
                            <td colspan="4" class="text-center text-muted py-3" style="font-size:0.85rem;">
                                <i class="bi bi-plug me-1"></i>No sessions configured
                            </td>
                        </tr>
                        <tr wicket:id="sessionRows">
                            <td class="fw-semibold" style="font-size:0.85rem;">
                                <span wicket:id="connName"></span>
                            </td>
                            <td><span wicket:id="connType" class="badge"></span></td>
                            <td><span wicket:id="connStatus" class="badge"></span></td>
                            <td class="text-muted font-monospace" style="font-size:0.8rem;">
                                <span wicket:id="txSeq"></span>&nbsp;/&nbsp;<span wicket:id="rxSeq"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Recent FIX Messages -->
        <div class="col-lg-7">
            <div class="table-card">
                <div class="table-card-header">
                    <span><i class="bi bi-activity me-2 text-secondary"></i>Recent Messages
                        <span class="text-muted fw-normal ms-1" style="font-size:0.75rem;">(active session, newest first)</span>
                    </span>
                    <a wicket:id="viewAllLink"
                       class="btn btn-xs border" style="font-size:0.75rem;padding:1px 8px;">
                        View All
                    </a>
                </div>
                <table class="table table-sm mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width:100px;">Time</th>
                            <th style="width:70px;">Dir</th>
                            <th style="width:44px;">Type</th>
                            <th>Summary</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr wicket:id="noMessages">
                            <td colspan="4" class="text-center text-muted py-3" style="font-size:0.85rem;">
                                <i class="bi bi-inbox me-1"></i>No messages yet — select a session and connect
                            </td>
                        </tr>
                        <tr wicket:id="recentMsgRows">
                            <td class="text-muted font-monospace" style="font-size:0.79rem;">
                                <span wicket:id="msgTime"></span>
                            </td>
                            <td><span wicket:id="msgDir"></span></td>
                            <td>
                                <span wicket:id="msgType"
                                      class="badge bg-light text-dark border font-monospace"></span>
                            </td>
                            <td style="font-size:0.8rem;">
                                <span wicket:id="msgSummary"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div><!-- end #dashboard -->

</wicket:extend>
</body>
</html>
