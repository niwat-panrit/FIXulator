# FIX Gateway configuration for FIX Simulator
# Loaded at startup by FixSimulatorApplication.
# Edit this file to change sessions, hosts, or ports.
# Restart the server after any change.

[DEFAULT]
ConnectionType=initiator
ReconnectInterval=5
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
UseDataDictionary=N
ResetOnLogon=N
FileStorePath=data/fix-store
CheckLatency=N
SocketConnectHost=host.docker.internal

# ── Session 1: FIX 4.4 ───────────────────────────────────────────────────────
[SESSION]
BeginString=FIX.4.4
SenderCompID=SIMULATOR
TargetCompID=EXCHANGE
SocketConnectPort=9876

# ── Session 2: FIX 5.0SP2 (transport: FIXT.1.1) ─────────────────────────────
[SESSION]
BeginString=FIXT.1.1
DefaultApplVerID=9
SenderCompID=SIMULATOR_2
TargetCompID=EXCHANGE
SocketConnectPort=9877
