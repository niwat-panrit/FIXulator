<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>

    <h1 style="margin-top:0; color:#1e3a5f;">Dashboard</h1>

    <!-- ── Stat cards ──────────────────────────────────────────────────── -->
    <div wicket:id="statsContainer" class="stat-grid">
        <div class="stat-card">
            <span class="label">Total Tasks</span>
            <span class="value" wicket:id="totalCount">0</span>
        </div>
        <div class="stat-card done">
            <span class="label">Completed</span>
            <span class="value" wicket:id="doneCount">0</span>
        </div>
        <div class="stat-card">
            <span class="label">Pending</span>
            <span class="value" wicket:id="pendingCount">0</span>
        </div>
        <div class="stat-card high">
            <span class="label">High-Priority Open</span>
            <span class="value" wicket:id="highCount">0</span>
        </div>
    </div>

    <!-- ── Charts ──────────────────────────────────────────────────────── -->
    <div class="section-title">Task Analytics</div>

    <div class="chart-row">
        <div class="chart-card">
            <h3>Tasks by Priority</h3>
            <!--
                Chart.js renders into this canvas.
                The Java DashboardPage.buildChartInitScript() emits the
                initialisation JS; on AJAX checkbox toggle it is re-emitted
                via target.appendJavaScript() to refresh both charts.
            -->
            <canvas id="barChart" style="max-height:260px"></canvas>
        </div>
        <div class="chart-card">
            <h3>Done vs Pending</h3>
            <canvas id="pieChart" style="max-height:260px"></canvas>
        </div>
    </div>

    <!-- ── Task table (quick view, 5 per page) ─────────────────────────── -->
    <div class="section-title">All Tasks (quick view)</div>

    <div wicket:id="tableContainer">
        <table class="data-table">
            <thead>
                <tr>
                    <th style="width:50px">Done</th>
                    <th>Title</th>
                    <th style="width:120px">Priority</th>
                    <th style="width:130px">Due Date</th>
                </tr>
            </thead>
            <tbody>
                <tr wicket:id="tasks">
                    <td style="text-align:center">
                        <input type="checkbox" wicket:id="doneCheck"/>
                    </td>
                    <td><span class="task-title" wicket:id="title">Title</span></td>
                    <td><span wicket:id="priority">Medium</span></td>
                    <td><span wicket:id="dueDate">—</span></td>
                </tr>
            </tbody>
        </table>

        <!-- Paging navigator -->
        <div class="pager">
            <span wicket:id="pager"></span>
        </div>
    </div>

    <br/>
    <a wicket:id="manageTasksLink" class="btn btn-primary">Manage Tasks &rarr;</a>

</wicket:extend>
</body>
</html>
